name: Import legacy comments once

on:
  push:
    branches:
      - agent/preserve-legacy-news-comments

permissions:
  contents: write

jobs:
  import-comments:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preserve-legacy-news-comments
      - name: Archive WordPress comments
        run: python scripts/import-wordpress-comments.py .
      - name: Commit generated archive
        run: |
          git add src/data/legacy-news-comments.json
          if git diff --cached --quiet; then
            echo "No comment archive changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "archive legacy WordPress comments"
          git push
