<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Optimal 123-cent change-making solution</title>
  <desc id="desc">One 100-cent coin, two 10-cent coins, and three 1-cent coins make 123 cents with the minimum six coins.</desc>
  <rect width="960" height="430" rx="24" fill="#f8fafc"/>
  <text x="48" y="58" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Change-Making — HiGHS optimum for 123¢</text>
  <text x="48" y="88" font-family="Arial, sans-serif" font-size="15" fill="#475569">Minimum coin count = 6 · integer optimum proven with zero MIP gap</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="150" cy="220" r="74" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <text x="150" y="210" font-size="32" font-weight="700" fill="#0f172a">100¢</text>
    <text x="150" y="239" font-size="14" fill="#475569">× 1</text>

    <circle cx="340" cy="220" r="54" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="340" y="213" font-size="25" font-weight="700" fill="#0f172a">10¢</text>
    <text x="340" y="238" font-size="14" fill="#475569">× 2</text>

    <circle cx="488" cy="220" r="54" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="488" y="213" font-size="25" font-weight="700" fill="#0f172a">10¢</text>
    <text x="488" y="238" font-size="14" fill="#475569">second</text>

    <circle cx="635" cy="220" r="36" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
    <text x="635" y="228" font-size="22" font-weight="700" fill="#0f172a">1¢</text>

    <circle cx="742" cy="220" r="36" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
    <text x="742" y="228" font-size="22" font-weight="700" fill="#0f172a">1¢</text>

    <circle cx="849" cy="220" r="36" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
    <text x="849" y="228" font-size="22" font-weight="700" fill="#0f172a">1¢</text>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="210" y="338" width="540" height="54" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="480" y="372" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">100 + 10 + 10 + 1 + 1 + 1 = 123¢</text>
  </g>
</svg>