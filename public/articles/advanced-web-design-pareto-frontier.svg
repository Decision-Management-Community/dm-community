<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Pareto frontier for the Advanced Website Design challenge</title>
  <desc id="desc">Twelve nondominated cost-value outcomes are shown. Seven are supported by a simple weighted-sum objective and five are Pareto-efficient but unsupported, demonstrating that a single weighted objective can miss valid tradeoffs.</desc>
  <rect width="1040" height="560" rx="24" fill="#f8fafc"/>
  <text x="50" y="50" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Advanced Website Design — enumerate the frontier before choosing weights</text>
  <text x="50" y="78" font-family="Arial,sans-serif" font-size="15" fill="#475569">1,024 subsets checked · 262 feasible · 12 unique Pareto outcomes · 5 are invisible to a simple weighted sum</text>

  <rect x="90" y="105" width="850" height="335" fill="#ffffff" stroke="#cbd5e1"/>
  <line x1="90" y1="440" x2="940" y2="440" stroke="#94a3b8"/>
  <line x1="90" y1="105" x2="90" y2="440" stroke="#94a3b8"/>

  <g font-family="Arial,sans-serif" font-size="12" fill="#64748b">
    <text x="90" y="465" text-anchor="middle">$0</text>
    <text x="265" y="465" text-anchor="middle">$2k</text>
    <text x="441" y="465" text-anchor="middle">$4k</text>
    <text x="616" y="465" text-anchor="middle">$6k</text>
    <text x="792" y="465" text-anchor="middle">$8k</text>
    <text x="940" y="465" text-anchor="middle">$9.69k</text>
    <text x="75" y="444" text-anchor="end">0</text>
    <text x="75" y="346" text-anchor="end">5</text>
    <text x="75" y="252" text-anchor="end">10</text>
    <text x="75" y="158" text-anchor="end">15</text>
    <text x="75" y="124" text-anchor="end">17</text>
  </g>

  <polyline points="90,440 177.7,383.5 265.4,345.9 353.2,327.1 440.9,308.2 523.3,289.4 528.6,270.6 616.3,214.1 704.0,176.5 756.7,157.6 840,138.8 940,120" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>

  <g fill="#2563eb" stroke="#1d4ed8" stroke-width="2">
    <circle cx="90" cy="440" r="7"/><circle cx="177.7" cy="383.5" r="7"/><circle cx="265.4" cy="345.9" r="7"/>
    <circle cx="704.0" cy="176.5" r="7"/><circle cx="756.7" cy="157.6" r="7"/><circle cx="840" cy="138.8" r="7"/><circle cx="940" cy="120" r="8"/>
  </g>
  <g fill="#f59e0b" stroke="#b45309" stroke-width="2">
    <circle cx="353.2" cy="327.1" r="7"/><circle cx="440.9" cy="308.2" r="7"/><circle cx="523.3" cy="289.4" r="7"/><circle cx="528.6" cy="270.6" r="7"/><circle cx="616.3" cy="214.1" r="7"/>
  </g>

  <g font-family="Arial,sans-serif" font-size="13" fill="#334155">
    <rect x="115" y="112" width="250" height="64" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="136" cy="136" r="6" fill="#2563eb"/><text x="150" y="141">supported by value − λ × cost</text>
    <circle cx="136" cy="159" r="6" fill="#f59e0b"/><text x="150" y="164">Pareto-efficient but unsupported</text>
  </g>

  <rect x="680" y="280" width="260" height="112" rx="14" fill="#f0fdf4" stroke="#86efac"/>
  <text x="810" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#166534">Best-value design</text>
  <text x="810" y="335" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0f172a">Value 17 · Cost $9,690</text>
  <text x="810" y="359" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">Features 3,4,5,6,7 + any two of 8,9,10</text>
  <text x="810" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">discount and surcharge both active</text>

  <text x="515" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">Discounted cost</text>
  <text x="25" y="275" transform="rotate(-90 25 275)" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">Total value</text>
</svg>