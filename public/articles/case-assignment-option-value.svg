<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="590" viewBox="0 0 1060 590" role="img" aria-labelledby="title desc">
  <title id="title">Case Assignment greedy failure versus scarcity-first assignment</title>
  <desc id="desc">A naive least-overqualified greedy rule assigns case 112 to Kevin Jones and then cannot place case 113. A scarcity-first heuristic preserves Kevin Jones for case 113 and reaches the unique global optimum with total overqualification 12.</desc>
  <rect width="1060" height="590" rx="24" fill="#f8fafc"/>
  <text x="48" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Case Assignment — preserve option value before going greedy</text>
  <text x="48" y="80" font-family="Arial,sans-serif" font-size="15" fill="#475569">The locally cheapest assignment can consume the only capacity needed by a future case</text>

  <rect x="48" y="112" width="458" height="398" rx="18" fill="#fff7ed" stroke="#fdba74"/>
  <text x="277" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#9a3412">Naive least-overqualified greedy</text>
  <text x="277" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#7c2d12">process cases in input order: 112 → 113 → 114 → 115</text>

  <rect x="82" y="208" width="170" height="82" rx="13" fill="#ffffff" stroke="#fdba74"/>
  <text x="167" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Case 112</text>
  <text x="167" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">5 candidates</text>
  <text x="167" y="279" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#9a3412">pick KJ · penalty 1</text>

  <path d="M252 249 H302" stroke="#fb923c" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <rect x="302" y="208" width="170" height="82" rx="13" fill="#ffffff" stroke="#fdba74"/>
  <text x="387" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">KJ capacity</text>
  <text x="387" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#475569">$200k → $150k</text>
  <text x="387" y="279" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#9a3412">option consumed</text>

  <path d="M387 290 V335" stroke="#fb923c" stroke-width="3" marker-end="url(#arrowOrange)"/>
  <rect x="165" y="335" width="224" height="100" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="277" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#991b1b">Case 113 arrives</text>
  <text x="277" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#7f1d1d">only KJ is feasible</text>
  <text x="277" y="415" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#991b1b">needs $200k · only $150k left → DEAD END</text>

  <rect x="554" y="112" width="458" height="398" rx="18" fill="#f0fdf4" stroke="#86efac"/>
  <text x="783" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#166534">Scarcity-first / regret-aware heuristic</text>
  <text x="783" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#166534">protect cases with the fewest alternatives before spending flexible capacity</text>

  <g font-family="Arial,sans-serif">
    <rect x="594" y="208" width="174" height="62" rx="12" fill="#ffffff" stroke="#86efac"/>
    <text x="681" y="233" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">1. 113 → KJ</text>
    <text x="681" y="254" text-anchor="middle" font-size="12" fill="#475569">1 candidate · penalty 3</text>

    <rect x="798" y="208" width="174" height="62" rx="12" fill="#ffffff" stroke="#86efac"/>
    <text x="885" y="233" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">2. 114 → JR</text>
    <text x="885" y="254" text-anchor="middle" font-size="12" fill="#475569">2 candidates · penalty 5</text>

    <rect x="594" y="294" width="174" height="62" rx="12" fill="#ffffff" stroke="#86efac"/>
    <text x="681" y="319" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">3. 112 → SR</text>
    <text x="681" y="340" text-anchor="middle" font-size="12" fill="#475569">4 remain · penalty 2</text>

    <rect x="798" y="294" width="174" height="62" rx="12" fill="#ffffff" stroke="#86efac"/>
    <text x="885" y="319" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">4. 115 → DS</text>
    <text x="885" y="340" text-anchor="middle" font-size="12" fill="#475569">5 candidates · penalty 2</text>
  </g>

  <rect x="635" y="390" width="296" height="82" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="783" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#166534">Total overqualification = 12</text>
  <text x="783" y="447" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#166534">HiGHS gap 0.0 · exhaustive check: unique optimum</text>

  <rect x="230" y="532" width="600" height="42" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="530" y="558" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#334155">Rules define eligibility. Optimization protects scarce options across the whole decision.</text>

  <defs>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#fb923c"/></marker>
  </defs>
</svg>